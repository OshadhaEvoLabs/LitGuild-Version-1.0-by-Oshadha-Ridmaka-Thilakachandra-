name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -x validateSigningDebug -x kspDebugKotlin

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "LitGuide Debug APK v1.0.${{ github.run_number }}"
          body: |
            ### LitGuide Debug Build
            - Commit: `${{ github.sha }}`
            - Run Number: #${{ github.run_number }}
            
            Download the attached `app-debug.apk` to install directly on your Android phone.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
